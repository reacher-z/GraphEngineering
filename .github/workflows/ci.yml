name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:fixtures
      - run: pnpm test:sqlite-ledger-contract
      - run: pnpm test:sqlite-transaction-owner-contract
      - run: pnpm test:sqlite-owner-composition-contract
      - run: pnpm test:sqlite-owner-composition-callsite-discovery
      - run: pnpm check:docs
      - run: pnpm check:task-controls
      - run: pnpm check:sqlite-migrations
      - run: pnpm check:release-map
      - run: pnpm check:evidence-closure

  typescript:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "20"
            sqlite: false
          - node: "22.16.0"
            sqlite: true
          - node: "22"
            sqlite: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.sqlite
        run: pnpm build
      - if: ${{ !matrix.sqlite }}
        run: pnpm --filter '!@graph-engineering/sqlite' --recursive build
      - run: node examples/quickstart/run.mjs
      - run: node examples/patterns/showcase.mjs
      - if: matrix.sqlite
        run: pnpm typecheck
      - if: ${{ !matrix.sqlite }}
        run: pnpm --filter '!@graph-engineering/sqlite' --recursive typecheck
      - if: matrix.sqlite
        run: pnpm lint
      - if: ${{ !matrix.sqlite }}
        run: pnpm --filter '!@graph-engineering/sqlite' --recursive lint
      - if: matrix.sqlite
        run: pnpm test
      - if: ${{ !matrix.sqlite }}
        run: pnpm --filter '!@graph-engineering/sqlite' --recursive test
      - if: matrix.node == '22.16.0'
        run: pnpm test:sqlite-benchmark

  package-artifacts:
    name: npm package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:packages
      - run: pnpm check:packed-install
      - run: pnpm check:sqlite-artifacts
      - run: pnpm audit:prod

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    # The complete suite alone is currently close to 20 minutes on the
    # reference runner. Leave bounded room for setup, static analysis,
    # quickstart smoke, and the 3.13 artifact checks.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --project python --extra dev --python ${{ matrix.python }} --locked
      - run: uv run --project python --python ${{ matrix.python }} pytest
      - run: uv run --project python --python ${{ matrix.python }} python examples/quickstart/run.py
      - run: uv run --project python --python ${{ matrix.python }} ruff check python/src python/tests
      - run: uv run --project python --python ${{ matrix.python }} mypy --config-file python/pyproject.toml python/src
      - if: matrix.python == '3.13'
        run: uv build --project python
      - if: matrix.python == '3.13'
        run: python3 scripts/check-python-artifacts.py

  progress-scanner:
    name: Progress scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/progress-scanner/tests -v

  cross-language-conformance:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project python --extra dev --python 3.13 --locked
      - run: pnpm test:sqlite-docs
      - run: pnpm test:sqlite-python-benchmark
      - run: pnpm test:conformance
      - run: pnpm test:sqlite-transaction-owner-runtime
      - name: Enforce SQLite Rule 12 cross-runtime parity
        timeout-minutes: 10
        run: pnpm test:sqlite-cursor-publication-rule12-parity
      - name: Enforce SQLite P11 owner-composition cross-runtime parity
        timeout-minutes: 10
        run: pnpm test:sqlite-owner-composition-parity
      - name: Enforce SQLite NP1 lower-native projection runtime and parity
        timeout-minutes: 15
        run: pnpm test:sqlite-native-projection-runtime
      - name: Classify every Python SQLite callsite candidate
        timeout-minutes: 10
        run: pnpm test:sqlite-owner-composition-python-callsite-classification
      - name: Enforce SQLite callsite-classification coverage parity
        timeout-minutes: 10
        run: pnpm test:sqlite-owner-composition-callsite-classification-parity
      - name: Validate the bounded SQLite P11 baseline-source callsite map
        timeout-minutes: 10
        run: pnpm test:sqlite-owner-composition-callsite-map-contract
      - name: Enforce the SQLite P11 scanner-classifier route-map join
        timeout-minutes: 10
        run: pnpm test:sqlite-owner-composition-callsite-route-map

  sqlite-cursor-pre-rebind-parity:
    name: SQLite cursor pre-rebind parity
    runs-on: ubuntu-latest
    # The parity command owns a 90-minute execution budget below. Keep setup
    # outside that budget and retain 30 minutes of explicit job-level margin.
    # Its bounded children are sequential: coverage <= 60m, production <= 12m,
    # Python report <= 5m, leaving 13m for builds and orchestration cleanup.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project python --extra dev --python 3.13 --locked
      - name: Execute exact B2 coverage and cross-runtime parity
        timeout-minutes: 90
        run: pnpm test:sqlite-cursor-pre-rebind-parity
      - name: Verify B3 source and target descriptor parity
        timeout-minutes: 5
        run: pnpm test:sqlite-cursor-publication-contract-parity
