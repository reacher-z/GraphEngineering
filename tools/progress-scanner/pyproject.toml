[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-engineering-progress-scanner"
version = "0.1.0"
description = "Local progress scanner for Graph Engineering development"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
graph-progress = "graph_progress:main"

[tool.setuptools]
py-modules = ["graph_progress"]
